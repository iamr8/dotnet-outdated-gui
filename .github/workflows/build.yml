name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # for the test-results check on PRs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test, verify & build
        # -Dorg.gradle.java.home overrides the machine-specific value in gradle.properties.
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure buildPlugin -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      # Compatibility check at PR time, against the current Rider only (one IDE download).
      # The full supported range (2024.3.6 / 2025.2.4 / 2026.1.4 / current) runs in compatibility.yml.
      - name: Verify plugin compatibility (current Rider)
        run: ./gradlew verifyPlugin -PverifierIdes=current -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      - name: Upload verifier report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/**
          if-no-files-found: warn

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always() # report even when tests fail
        with:
          name: Test results
          path: build/test-results/test/*.xml
          reporter: java-junit

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/test/**
          if-no-files-found: warn

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}
          path: build/distributions/*.zip
          if-no-files-found: error

  # Every successful build on main is published as an EAP pre-release (GitHub only, NOT the
  # Marketplace) so the team can download the zip and install it in Rider for testing. The plugin
  # version is date + build number (0.0.0-eap.<yyyyMMdd>.<run>) so it always sorts below a real
  # release; the release notes name the target version (the VERSION file) and list the PRs since
  # the last stable tag.
  eap:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the pre-release + tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need tags + history for the "PRs since last release" list

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute EAP version
        id: ver
        run: |
          date="$(date -u +%Y%m%d)"
          eap="0.0.0-eap.${date}.${{ github.run_number }}"
          tag="eap-${date}.${{ github.run_number }}"
          target="$(cat VERSION)"
          echo "eap=$eap"       >> "$GITHUB_OUTPUT"
          echo "tag=$tag"       >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Build EAP plugin
        run: ./gradlew buildPlugin -PpluginVersion="${{ steps.ver.outputs.eap }}" -Dorg.gradle.java.home="$JAVA_HOME" --stacktrace

      - name: Collect PRs since last release
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(git tag -l 'v*' | sort -V | tail -1)"
          if [ -n "$last" ]; then
            since="$(git log -1 --format=%cI "$last")"
            list="$(gh pr list --state merged --base main --search "merged:>$since" --json number,title --jq '.[] | "- #\(.number) \(.title)"')"
            echo "base=$last" >> "$GITHUB_OUTPUT"
          else
            list="$(gh pr list --state merged --base main --json number,title --jq '.[] | "- #\(.number) \(.title)"')"
            echo "base=(none)" >> "$GITHUB_OUTPUT"
          fi
          [ -z "$list" ] && list="_(no merged PRs found)_"
          {
            echo "list<<PRS_EOF"
            echo "$list"
            echo "PRS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish EAP pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "EAP ${{ steps.ver.outputs.target }} · ${{ steps.ver.outputs.tag }}"
          prerelease: true
          files: build/distributions/*.zip
          body: |
            **Early-access (EAP) dev build — target version `${{ steps.ver.outputs.target }}`.**
            Not published to the JetBrains Marketplace. For local testing only.

            Plugin version: `${{ steps.ver.outputs.eap }}` (date + build; always sorts below a real release).

            ### Install
            Download the `.zip` below, then in Rider:
            **Settings → Plugins → ⚙ → Install Plugin from Disk…**, pick the zip, and restart.
            Uninstall it before installing a real Marketplace release.

            ### PRs since ${{ steps.prs.outputs.base }}
            ${{ steps.prs.outputs.list }}
